<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30">
  <!-- Broken/Damaged house with cracks -->
  <!-- Damaged roof -->
  <path fill="#9B59B6" d="M12 2L2 12h2v8h16v-8h2L12 2z" opacity="0.8"/>
  <!-- Main house body -->
  <rect x="4" y="10" width="16" height="10" fill="#B19CD9" opacity="0.9"/>
  <!-- Crack lines indicating damage -->
  <line x1="12" y1="10" x2="10" y2="15" stroke="#333" stroke-width="1.5"/>
  <line x1="12" y1="10" x2="14" y2="15" stroke="#333" stroke-width="1.5"/>
  <line x1="8" y1="12" x2="16" y2="12" stroke="#333" stroke-width="0.8" opacity="0.6"/>
  <!-- Broken door -->
  <rect x="10" y="14" width="4" height="6" fill="#D3949B" opacity="0.7"/>
  <!-- X mark for damaged -->
  <line x1="11" y1="15" x2="13" y2="19" stroke="#333" stroke-width="1"/>
  <line x1="13" y1="15" x2="11" y2="19" stroke="#333" stroke-width="1"/>
  <!-- Damaged windows -->
  <rect x="5" y="12" width="3" height="3" fill="#95B3D0" opacity="0.6"/>
  <rect x="16" y="12" width="3" height="3" fill="#95B3D0" opacity="0.6"/>
</svg>